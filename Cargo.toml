[package]
name = "ttc-ai"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Token Tight Command: local semantic command output filtering with recovery"

[lib]
name = "ttc_ai"

[[bin]]
name = "ttc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
shell-words = "1"
sha2 = "0.10"
getrandom = "0.3"
dirs = "6"
fs2 = "0.4"
glob = "0.3"
serde_yaml = "0.9"
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
