[package]
name = "ttc"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Local command wrapper for safe Bash output compaction"
license = "MIT"
repository = "https://github.com/skirja/ttc-ai"

[dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs", "signal", "user"] }
signal-hook = "=0.4.4"
toml = "=0.9.7"
serde_json = "=1.0.145"
serde = { version = "=1.0.229", features = ["derive"] }
globset = "=0.4.20"
yaml-rust2 = "=0.13.0"
quick-xml = "=0.42.0"
sha2 = "=0.10.9"
toml_edit = { version = "=0.23.7", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal", "term"] }

[lints.rust]
unsafe_code = "forbid"
