name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust baseline
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Verify format
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build debug binary
        run: cargo build

      - name: Build release binary
        run: cargo build --release

  m2-passthrough:
    name: M2 passthrough safety
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Verify process execution
        run: cargo test --test execution

      - name: Verify byte-exact passthrough
        run: cargo test --test passthrough

      - name: Verify signal propagation
        run: cargo test --test signals

      - name: Verify POSIX shell and TTY behavior
        run: cargo test --test shell_contract

      - name: Build release binary for evidence
        run: cargo build --release

      - name: Record baseline byte comparison
        run: sh scripts/m2-evidence.sh target/m2-evidence/report.txt

      - name: Upload passing comparison report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-byte-comparison
          path: target/m2-evidence/report.txt
          if-no-files-found: error

  m3-streaming:
    name: M3 streaming and raw retrieval
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Verify streaming and raw retrieval
        run: |
          cargo test --test streaming
          cargo test --test raw_store
          cargo test --test raw_cli
          cargo test --test storage_failure
          cargo test --test config

      - name: Build release binary
        run: cargo build --release

      - name: Record bounded memory evidence
        run: sh scripts/m3-evidence.sh target/m3-evidence/report.txt

      - name: Upload passing M3 report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-streaming-evidence
          path: target/m3-evidence/report.txt
          if-no-files-found: error

  m4-javascript:
    name: M4 JavaScript filtering and real tools
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Verify M4 classifier, safety, fixtures, E2E, and reduction
        run: |
          cargo test --test classifier
          cargo test --test filter_safety
          cargo test --test javascript_fixtures
          cargo test --test javascript_e2e
          cargo test --test reduction

      - name: Build release binary
        run: cargo build --release

      - name: Record large-fixture reductions
        run: sh scripts/m4-reduction.sh target/m4-evidence/reduction.txt

      - name: Run pinned real-tool smoke tests
        run: sh scripts/m4-smoke.sh target/release/ttc target/m4-evidence/report.txt

      - name: Upload passing M4 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-javascript-evidence
          path: target/m4-evidence/
          if-no-files-found: error

  m5-core-ecosystems:
    name: M5 Rust, Python, and Go filtering
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Install pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Install pinned Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.27.1

      - name: Verify ecosystem fixtures and reduction
        run: |
          set -o pipefail
          mkdir -p target/m5-evidence
          : > target/m5-evidence/fixtures.txt
          cargo test --test classifier 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test filter_safety 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test rust_fixtures 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test python_fixtures 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test go_fixtures 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test core_ecosystem_e2e 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test reduction -- --nocapture 2>&1 | tee target/m5-evidence/reduction.txt

      - name: Build release binary
        run: cargo build --release

      - name: Run pinned Rust, Python, and Go real-tool smoke tests
        run: sh scripts/m5-smoke.sh target/release/ttc target/m5-evidence/report.txt

      - name: Upload passing M5 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m5-core-ecosystem-evidence
          path: target/m5-evidence/
          if-no-files-found: error

  m6-package-monorepo:
    name: M6 package scripts and monorepo support
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Install pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Install pinned Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.27.1

      - name: Verify package, workspace, runner, and mixed-language fixtures
        run: |
          set -o pipefail
          mkdir -p target/m6-evidence
          : > target/m6-evidence/fixtures.txt
          cargo test --test manifests 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test package_scripts 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test monorepo -- --nocapture 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test mixed_monorepo 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test classifier 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test javascript_e2e 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test filter_safety 2>&1 | tee -a target/m6-evidence/fixtures.txt

      - name: Build production binary
        run: cargo build --release

      - name: Run pinned manager and monorepo runner smoke tests
        run: sh scripts/m6-smoke.sh target/release/ttc target/m6-evidence/report.txt

      - name: Record evidence checksums
        run: sha256sum target/m6-evidence/fixtures.txt target/m6-evidence/report.txt > target/m6-evidence/SHA256SUMS

      - name: Upload passing M6 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m6-monorepo-evidence
          path: target/m6-evidence/
          if-no-files-found: error
