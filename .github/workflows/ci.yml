name: Validasi TTC

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    name: Kebijakan dan build Linux
    runs-on: ubuntu-24.04
    outputs:
      full_gate: ${{ steps.classify.outputs.full_gate }}
    steps:
      - name: Ambil riwayat untuk audit perubahan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pasang Python yang dipin
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Uji kebijakan perubahan CI
        run: python3 scripts/test-ci-change-policy.py

      - name: Pilih gate ringan atau penuh
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/classify-ci-changes.py

      - name: Uji kebijakan rilis stabil
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/test-release-policy.py
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/check-release-version.py Cargo.toml "$REF_NAME"
          else
            python3 scripts/check-release-version.py Cargo.toml
          fi

      - name: Pasang Rust 1.98.1
        if: steps.classify.outputs.full_gate == 'true'
        run: rustup toolchain install 1.98.1 --profile minimal --target x86_64-unknown-linux-gnu

      - name: Build binary release Linux
        if: steps.classify.outputs.full_gate == 'true'
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Siapkan binary smoke dengan checksum
        if: steps.classify.outputs.full_gate == 'true'
        run: |
          set -euo pipefail
          mkdir -p target/ci-smoke-binary
          install -m 755 target/x86_64-unknown-linux-gnu/release/ttc target/ci-smoke-binary/ttc
          cd target/ci-smoke-binary
          sha256sum ttc > SHA256SUMS
          sha256sum --check --status SHA256SUMS

      - name: Bagikan binary smoke untuk run ini
        if: steps.classify.outputs.full_gate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary/
          if-no-files-found: error
          retention-days: 1

  rust-safety:
    name: Rust dan keselamatan eksekusi
    needs: prepare
    if: needs.prepare.outputs.full_gate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Ambil source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pasang Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Pulihkan dan periksa binary smoke
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary

      - name: Verifikasi checksum binary smoke
        run: |
          sha256sum --check target/ci-smoke-binary/SHA256SUMS
          mkdir -p target/release
          install -m 755 target/ci-smoke-binary/ttc target/release/ttc

      - name: Periksa format Rust
        run: cargo fmt --all -- --check

      - name: Jalankan Clippy dengan warning ditolak
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Jalankan seluruh suite Rust dan rekam bukti fixture
        run: |
          set -o pipefail
          mkdir -p target/ci-evidence
          TTC_M8_EVIDENCE=1 cargo test --all-targets --all-features -- --test-threads=1 --nocapture 2>&1 | tee target/ci-evidence/rust-suite.txt

      - name: Verifikasi passthrough byte-exact
        run: sh scripts/m2-evidence.sh target/ci-evidence/passthrough/report.txt

      - name: Verifikasi memori streaming terbatas
        run: sh scripts/m3-evidence.sh target/ci-evidence/streaming/report.txt target/release/ttc

      - name: Buat dan periksa manifest bukti
        run: |
          set -euo pipefail
          cd target/ci-evidence
          find . -type f ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Unggah bukti Rust dan keselamatan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-safety-evidence
          path: target/ci-evidence/
          if-no-files-found: error

  javascript-monorepo:
    name: JavaScript dan monorepo
    needs: prepare
    if: needs.prepare.outputs.full_gate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Ambil source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pulihkan dan periksa binary smoke
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary

      - name: Verifikasi checksum binary smoke
        run: |
          sha256sum --check target/ci-smoke-binary/SHA256SUMS
          mkdir -p target/release
          install -m 755 target/ci-smoke-binary/ttc target/release/ttc

      - name: Pasang Node.js 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Pasang Python 3.14.7
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Pasang Go 1.27.1
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.27.1

      - name: Pasang Rust 1.98.1 untuk fixture workspace
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Jalankan smoke JavaScript dan monorepo
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/m4-smoke.sh target/release/ttc target/ci-evidence/javascript/report.txt
          sh scripts/m6-smoke.sh target/release/ttc target/ci-evidence/monorepo

      - name: Buat dan periksa manifest bukti
        run: |
          set -euo pipefail
          cd target/ci-evidence
          find . -type f ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Unggah bukti JavaScript dan monorepo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javascript-monorepo-evidence
          path: target/ci-evidence/
          if-no-files-found: error

  rust-python-go:
    name: Rust, Python, dan Go
    needs: prepare
    if: needs.prepare.outputs.full_gate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Ambil source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pasang Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Pasang Python 3.14.7
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Pasang Go 1.27.1
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.27.1

      - name: Pulihkan dan periksa binary smoke
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary

      - name: Verifikasi checksum binary smoke
        run: |
          sha256sum --check target/ci-smoke-binary/SHA256SUMS
          mkdir -p target/release
          install -m 755 target/ci-smoke-binary/ttc target/release/ttc

      - name: Pasang cargo-nextest 0.9.108 terverifikasi
        run: |
          set -euo pipefail
          sh scripts/m5-install-nextest.sh "$RUNNER_TEMP/ttc-tools"
          printf 'M5_NEXTEST_BIN=%s/cargo-nextest\n' "$RUNNER_TEMP/ttc-tools" >> "$GITHUB_ENV"

      - name: Jalankan smoke Rust, Python, dan Go
        run: |
          set -euo pipefail
          mkdir -p target/ci-evidence
          sh scripts/m5-smoke.sh target/release/ttc target/ci-evidence/report.txt

      - name: Buat dan periksa manifest bukti
        run: |
          set -euo pipefail
          cd target/ci-evidence
          find . -type f ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Unggah bukti Rust, Python, dan Go
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-python-go-evidence
          path: target/ci-evidence/
          if-no-files-found: error

  php-jvm-dotnet:
    name: PHP, JVM, dan .NET
    needs: prepare
    if: needs.prepare.outputs.full_gate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Ambil source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pulihkan dan periksa binary smoke
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary

      - name: Verifikasi checksum binary smoke
        run: |
          sha256sum --check target/ci-smoke-binary/SHA256SUMS
          mkdir -p target/release
          install -m 755 target/ci-smoke-binary/ttc target/release/ttc

      - name: Pasang PHP 8.4.25 dan Composer 2.10.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.4.25
          tools: composer:2.10.3
          extensions: zip
          coverage: none

      - name: Build PHP 8.4.25 dari source terverifikasi
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libonig-dev libssl-dev libzip-dev zlib1g-dev
          tool_home="$RUNNER_TEMP/m7-tools"
          mkdir -p target/ci-evidence
          if M7_TOOL_HOME="$tool_home" sh scripts/m7-install-php.sh > target/ci-evidence/php-build.log 2>&1; then
            "$tool_home/php-8.4.25/bin/php" --version
          else
            tail -c 12000 target/ci-evidence/php-build.log
            exit 1
          fi
          printf '%s/php-8.4.25/bin\n' "$tool_home" >> "$GITHUB_PATH"

      - name: Pasang Java 21.0.12.1
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS

      - name: Pasang .NET 10.0.401
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: Pasang Maven 3.9.16 dan Gradle 9.8.0 terverifikasi
        shell: bash
        run: |
          export M7_TOOL_HOME="$RUNNER_TEMP/m7-tools"
          . scripts/m7-install-jvm-tools.sh
          printf '%s\n' "$MAVEN_HOME/bin" "$GRADLE_HOME/bin" >> "$GITHUB_PATH"
          printf 'M7_MAVEN_SHA256=%s\n' "$M7_MAVEN_SHA256" >> "$GITHUB_ENV"
          printf 'M7_GRADLE_SHA256=%s\n' "$M7_GRADLE_SHA256" >> "$GITHUB_ENV"

      - name: Jalankan smoke PHP, JVM, dan .NET
        shell: bash
        run: |
          set -euo pipefail
          if sh scripts/m7-smoke.sh target/release/ttc target/ci-evidence/report.txt > target/ci-evidence/smoke.log 2>&1; then
            tail -n 24 target/ci-evidence/report.txt
          else
            tail -c 12000 target/ci-evidence/smoke.log
            exit 1
          fi

      - name: Buat dan periksa manifest bukti
        run: |
          set -euo pipefail
          cd target/ci-evidence
          find . -type f ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Unggah bukti PHP, JVM, dan .NET
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-jvm-dotnet-evidence
          path: target/ci-evidence/
          if-no-files-found: error

  build-infrastructure:
    name: Build, Ruby, Swift, dan infrastruktur
    needs: prepare
    if: needs.prepare.outputs.full_gate == 'true'
    runs-on: ubuntu-24.04
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/m8-smoke/ruby/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/target/m8-bundle
    steps:
      - name: Ambil source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pulihkan dan periksa binary smoke
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary

      - name: Verifikasi checksum binary smoke
        run: |
          sha256sum --check target/ci-smoke-binary/SHA256SUMS
          mkdir -p target/release
          install -m 755 target/ci-smoke-binary/ttc target/release/ttc

      - name: Pasang Ruby 3.3.8 dan Bundler 2.6.9
        uses: ruby/setup-ruby@6797dcbb9a1889fd411d07e8aba7eded53fb8b48 # v1.264.0
        with:
          ruby-version: 3.3.8
          bundler: 2.6.9

      - name: Pasang Swift 6.1.2
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: 6.1.2

      - name: Pasang Docker Engine 28.1.1 terisolasi
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v28.1.1
          context: ttc-ci-docker
          runtime-basedir: ${{ runner.temp }}/ttc-ci-docker
          set-host: true

      - name: Pasang Buildx 0.23.0
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0
        with:
          version: v0.23.0
          driver: docker

      - name: Pasang Compose 2.35.1
        uses: docker/setup-compose-action@364cc21a5de5b1ee4a7f5f9d3fa374ce0ccde746 # v1.2.0
        with:
          version: v2.35.1
          cache-binary: false

      - name: Pasang Make, CMake, Ninja, Terraform, dan Helm terverifikasi
        shell: bash
        run: |
          set -euo pipefail
          tool_home="$RUNNER_TEMP/m8-tools"
          mkdir -p "$tool_home"
          M8_TOOL_HOME="$tool_home" sh scripts/m8-install-tools.sh
          printf '%s/bin\n' "$tool_home" >> "$GITHUB_PATH"
          printf '%s/cmake-3.31.6-linux-x86_64/bin\n' "$tool_home" >> "$GITHUB_PATH"

      - name: Pasang dependency Ruby dari lockfile
        run: bundle install --jobs 4 --retry 3

      - name: Jalankan smoke build, Ruby, Swift, dan infrastruktur
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ci-evidence
          if sh -x scripts/m8-smoke.sh target/release/ttc target/ci-evidence > target/ci-evidence/smoke.log 2>&1; then
            tail -n 24 target/ci-evidence/smoke-report.txt
          else
            tail -c 12000 target/ci-evidence/smoke.log
            exit 1
          fi

      - name: Buat dan periksa manifest bukti
        run: |
          set -euo pipefail
          cd target/ci-evidence
          find . -type f ! -name SHA256SUMS ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check --status SHA256SUMS
          find . -type f ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Unggah bukti build, Ruby, Swift, dan infrastruktur
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-ruby-swift-infrastructure-evidence
          path: target/ci-evidence/
          if-no-files-found: error

  linux-artifact:
    name: Gate CI dan artifact Linux
    needs:
      - prepare
      - rust-safety
      - javascript-monorepo
      - rust-python-go
      - php-jvm-dotnet
      - build-infrastructure
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Periksa hasil job wajib
        env:
          FULL_GATE: ${{ needs.prepare.outputs.full_gate }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RUST_SAFETY_RESULT: ${{ needs['rust-safety'].result }}
          JAVASCRIPT_MONOREPO_RESULT: ${{ needs['javascript-monorepo'].result }}
          RUST_PYTHON_GO_RESULT: ${{ needs['rust-python-go'].result }}
          PHP_JVM_DOTNET_RESULT: ${{ needs['php-jvm-dotnet'].result }}
          BUILD_INFRASTRUCTURE_RESULT: ${{ needs['build-infrastructure'].result }}
        run: |
          set -euo pipefail
          test "$PREPARE_RESULT" = success
          if [ "$FULL_GATE" = true ]; then
            for result in "$RUST_SAFETY_RESULT" "$JAVASCRIPT_MONOREPO_RESULT" \
              "$RUST_PYTHON_GO_RESULT" "$PHP_JVM_DOTNET_RESULT" "$BUILD_INFRASTRUCTURE_RESULT"; do
              test "$result" = success
            done
          elif [ "$FULL_GATE" = false ]; then
            for result in "$RUST_SAFETY_RESULT" "$JAVASCRIPT_MONOREPO_RESULT" \
              "$RUST_PYTHON_GO_RESULT" "$PHP_JVM_DOTNET_RESULT" "$BUILD_INFRASTRUCTURE_RESULT"; do
              test "$result" = skipped
            done
          else
            printf 'CI gate classification missing or invalid: %s\n' "$FULL_GATE" >&2
            exit 1
          fi

      - name: Ambil source bersih
        if: needs.prepare.outputs.full_gate == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pasang Rust 1.98.1 untuk target Linux
        if: needs.prepare.outputs.full_gate == 'true'
        run: rustup toolchain install 1.98.1 --profile minimal --target x86_64-unknown-linux-gnu

      - name: Pasang Python 3.14.7
        if: needs.prepare.outputs.full_gate == 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Build ulang binary kandidat dari source bersih
        if: needs.prepare.outputs.full_gate == 'true'
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Verifikasi installer, artifact mandiri, dan coverage SPEC
        if: needs.prepare.outputs.full_gate == 'true'
        run: |
          set -euo pipefail
          mkdir -p target/ci-candidate/evidence
          ./scripts/test-install.sh 2>&1 | tee target/ci-candidate/evidence/installer.txt
          ./scripts/test-release-artifact.sh 2>&1 | tee target/ci-candidate/evidence/standalone.txt
          python3 scripts/check-spec-coverage.py > target/ci-candidate/evidence/coverage.md

      - name: Ambil bukti suite yang lulus
        if: needs.prepare.outputs.full_gate == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "*-evidence"
          path: target/ci-candidate/evidence/prerequisites

      - name: Verifikasi bukti, provenance, dan checksum kandidat
        if: needs.prepare.outputs.full_gate == 'true'
        shell: bash
        env:
          CHECKOUT_COMMIT: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          install -m 755 target/x86_64-unknown-linux-gnu/release/ttc target/ci-candidate/ttc-x86_64-unknown-linux-gnu
          install -m 755 install.sh target/ci-candidate/install.sh
          TTC_M9_BINARY="$PWD/target/ci-candidate/ttc-x86_64-unknown-linux-gnu" ./scripts/test-release-artifact.sh > target/ci-candidate/evidence/packaged-smoke.txt
          python3 scripts/verify-m9-evidence.py target/ci-candidate/evidence/prerequisites
          printf 'commit=%s\nrun=%s\nversion=' "$CHECKOUT_COMMIT" "$CI_RUN_URL" > target/ci-candidate/evidence/provenance.txt
          python3 scripts/check-release-version.py Cargo.toml >> target/ci-candidate/evidence/provenance.txt
          cd target/ci-candidate
          sha256sum ttc-x86_64-unknown-linux-gnu install.sh > SHA256SUMS
          sha256sum --check --status SHA256SUMS
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Unggah kandidat Linux setelah seluruh gate lulus
        if: needs.prepare.outputs.full_gate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ttc-linux-gnu-candidate
          path: target/ci-candidate/
          if-no-files-found: error

      - name: Rekam gate dokumentasi ringan
        if: needs.prepare.outputs.full_gate == 'false'
        run: echo "Light documentation checks passed for this commit."
