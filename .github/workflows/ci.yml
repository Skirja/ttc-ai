name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-policy:
    name: Stable release policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7
      - name: Test tag policy and validate event
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/test-release-policy.py
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/check-release-version.py Cargo.toml "$REF_NAME"
          else
            python3 scripts/check-release-version.py Cargo.toml
          fi

  rust:
    needs: release-policy
    name: Rust baseline
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Verify format
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build debug binary
        run: cargo build

      - name: Build release binary
        run: cargo build --release

  m2-passthrough:
    needs: release-policy
    name: M2 passthrough safety
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Verify process execution
        run: cargo test --test execution

      - name: Verify byte-exact passthrough
        run: cargo test --test passthrough

      - name: Verify signal propagation
        run: cargo test --test signals

      - name: Verify POSIX shell and TTY behavior
        run: cargo test --test shell_contract

      - name: Build release binary for evidence
        run: cargo build --release

      - name: Record baseline byte comparison
        run: sh scripts/m2-evidence.sh target/m2-evidence/report.txt

      - name: Upload passing comparison report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-byte-comparison
          path: target/m2-evidence/report.txt
          if-no-files-found: error

  m3-streaming:
    needs: release-policy
    name: M3 streaming and raw retrieval
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Verify streaming and raw retrieval
        run: |
          cargo test --test streaming
          cargo test --test raw_store
          cargo test --test raw_cli
          cargo test --test storage_failure
          cargo test --test config

      - name: Build release binary
        run: cargo build --release

      - name: Record bounded memory evidence
        run: sh scripts/m3-evidence.sh target/m3-evidence/report.txt

      - name: Upload passing M3 report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-streaming-evidence
          path: target/m3-evidence/report.txt
          if-no-files-found: error

  m4-javascript:
    needs: release-policy
    name: M4 JavaScript filtering and real tools
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Verify M4 classifier, safety, fixtures, E2E, and reduction
        run: |
          cargo test --test classifier
          cargo test --test filter_safety
          cargo test --test javascript_fixtures
          cargo test --test javascript_e2e
          cargo test --test reduction

      - name: Build release binary
        run: cargo build --release

      - name: Record large-fixture reductions
        run: sh scripts/m4-reduction.sh target/m4-evidence/reduction.txt

      - name: Run pinned real-tool smoke tests
        run: sh scripts/m4-smoke.sh target/release/ttc target/m4-evidence/report.txt

      - name: Upload passing M4 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-javascript-evidence
          path: target/m4-evidence/
          if-no-files-found: error

  m5-core-ecosystems:
    needs: release-policy
    name: M5 Rust, Python, and Go filtering
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Install pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Install pinned Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.27.1

      - name: Verify ecosystem fixtures and reduction
        run: |
          set -o pipefail
          mkdir -p target/m5-evidence
          : > target/m5-evidence/fixtures.txt
          cargo test --test classifier 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test filter_safety 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test rust_fixtures 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test python_fixtures 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test go_fixtures 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test core_ecosystem_e2e 2>&1 | tee -a target/m5-evidence/fixtures.txt
          cargo test --test reduction -- --nocapture 2>&1 | tee target/m5-evidence/reduction.txt

      - name: Build release binary
        run: cargo build --release

      - name: Run pinned Rust, Python, and Go real-tool smoke tests
        run: sh scripts/m5-smoke.sh target/release/ttc target/m5-evidence/report.txt

      - name: Upload passing M5 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m5-core-ecosystem-evidence
          path: target/m5-evidence/
          if-no-files-found: error

  m6-package-monorepo:
    needs: release-policy
    name: M6 package scripts and monorepo support
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Install pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Install pinned Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.27.1

      - name: Verify package, workspace, runner, and mixed-language fixtures
        run: |
          set -o pipefail
          mkdir -p target/m6-evidence
          : > target/m6-evidence/fixtures.txt
          cargo test --test manifests 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test package_scripts 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test monorepo -- --nocapture 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test mixed_monorepo 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test classifier 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test javascript_e2e 2>&1 | tee -a target/m6-evidence/fixtures.txt
          cargo test --test filter_safety 2>&1 | tee -a target/m6-evidence/fixtures.txt

      - name: Build production binary
        run: cargo build --release

      - name: Run pinned manager and monorepo runner smoke tests
        run: sh scripts/m6-smoke.sh target/release/ttc target/m6-evidence/report.txt

      - name: Record evidence checksums
        run: sha256sum target/m6-evidence/fixtures.txt target/m6-evidence/report.txt > target/m6-evidence/SHA256SUMS

      - name: Upload passing M6 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m6-monorepo-evidence
          path: target/m6-evidence/
          if-no-files-found: error

  m7-php-jvm-dotnet:
    needs: release-policy
    name: M7 PHP, JVM, and .NET filtering
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Install pinned PHP and Composer
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.4.25
          tools: composer:2.10.3
          extensions: zip
          coverage: none

      - name: Build exact checksum-verified PHP runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libonig-dev libssl-dev libzip-dev zlib1g-dev
          tool_home="$RUNNER_TEMP/m7-tools"
          mkdir -p target/m7-evidence
          if M7_TOOL_HOME="$tool_home" sh scripts/m7-install-php.sh > target/m7-evidence/php-build.log 2>&1; then
            "$tool_home/php-8.4.25/bin/php" --version
          else
            tail -c 12000 target/m7-evidence/php-build.log
            exit 1
          fi
          printf '%s/php-8.4.25/bin\n' "$tool_home" >> "$GITHUB_PATH"

      - name: Install pinned Java 21 LTS
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          # Adoptium SemVer for the pinned runtime 21.0.12.1+1.
          java-version: 21.0.12+101.0.LTS

      - name: Install pinned .NET 10 LTS
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: Install checksum-verified Maven and Gradle
        shell: bash
        run: |
          export M7_TOOL_HOME="$RUNNER_TEMP/m7-tools"
          . scripts/m7-install-jvm-tools.sh
          printf '%s\n' "$MAVEN_HOME/bin" "$GRADLE_HOME/bin" >> "$GITHUB_PATH"
          printf 'M7_MAVEN_SHA256=%s\n' "$M7_MAVEN_SHA256" >> "$GITHUB_ENV"
          printf 'M7_GRADLE_SHA256=%s\n' "$M7_GRADLE_SHA256" >> "$GITHUB_ENV"

      - name: Verify M7 classifier, manifests, safety, and fixtures
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/m7-evidence
          : > target/m7-evidence/fixtures.txt
          cargo test --test classifier 2>&1 | tee -a target/m7-evidence/fixtures.txt
          cargo test --test manifests 2>&1 | tee -a target/m7-evidence/fixtures.txt
          cargo test --test filter_safety 2>&1 | tee -a target/m7-evidence/fixtures.txt
          cargo test --test php_fixtures 2>&1 | tee -a target/m7-evidence/fixtures.txt
          cargo test --test jvm_fixtures 2>&1 | tee -a target/m7-evidence/fixtures.txt
          cargo test --test dotnet_fixtures 2>&1 | tee -a target/m7-evidence/fixtures.txt
          cargo test --test additional_ecosystem_e2e 2>&1 | tee -a target/m7-evidence/fixtures.txt
          cargo test --test reduction -- --nocapture 2>&1 | tee -a target/m7-evidence/fixtures.txt

      - name: Build production binary
        run: cargo build --release

      - name: Run pinned PHP, JVM, and .NET smoke tests
        shell: bash
        run: |
          if sh scripts/m7-smoke.sh target/release/ttc target/m7-evidence/report.txt > target/m7-evidence/smoke.log 2>&1; then
            tail -n 24 target/m7-evidence/report.txt
          else
            tail -c 12000 target/m7-evidence/smoke.log
            exit 1
          fi

      - name: Record passing M7 checksums
        run: sha256sum scripts/m7-tool-versions.txt scripts/m7-tool-checksums.txt target/m7-evidence/fixtures.txt target/m7-evidence/report.txt > target/m7-evidence/SHA256SUMS

      - name: Upload passing M7 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m7-php-jvm-dotnet-evidence
          path: target/m7-evidence/
          if-no-files-found: error

  m8-remaining-ecosystems:
    needs: release-policy
    name: M8 build, Ruby, Swift, containers, and infrastructure
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/m8-smoke/ruby/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/target/m8-bundle
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Install pinned Ruby and Bundler
        uses: ruby/setup-ruby@6797dcbb9a1889fd411d07e8aba7eded53fb8b48 # v1.264.0
        with:
          ruby-version: 3.3.8
          bundler: 2.6.9

      - name: Install pinned Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: 6.1.2

      - name: Install isolated pinned Docker engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v28.1.1
          context: ttc-m8-docker
          runtime-basedir: ${{ runner.temp }}/ttc-m8-docker
          set-host: true

      - name: Install pinned Buildx and Compose
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0
        with:
          version: v0.23.0
          driver: docker
      - uses: docker/setup-compose-action@364cc21a5de5b1ee4a7f5f9d3fa374ce0ccde746 # v1.2.0
        with:
          version: v2.35.1
          cache-binary: false

      - name: Install checksum-verified Make, Terraform, and Helm
        shell: bash
        run: |
          set -euo pipefail
          tool_home="$RUNNER_TEMP/m8-tools"
          mkdir -p "$tool_home"
          M8_TOOL_HOME="$tool_home" sh scripts/m8-install-tools.sh
          printf '%s/bin\n' "$tool_home" >> "$GITHUB_PATH"
          printf '%s/cmake-3.31.6-linux-x86_64/bin\n' "$tool_home" >> "$GITHUB_PATH"

      - name: Install locked Ruby smoke dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Verify M8 classifier, fixtures, retention, and raw command matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/m8-evidence
          : > target/m8-evidence/fixtures.log
          cargo test --test classifier 2>&1 | tee -a target/m8-evidence/fixtures.log
          cargo test --test filter_safety 2>&1 | tee -a target/m8-evidence/fixtures.log
          TTC_M8_EVIDENCE=1 cargo test --test build_tool_fixtures -- --test-threads=1 --nocapture 2>&1 | tee -a target/m8-evidence/fixtures.log
          TTC_M8_EVIDENCE=1 cargo test --test ruby_swift_fixtures -- --test-threads=1 --nocapture 2>&1 | tee -a target/m8-evidence/fixtures.log
          TTC_M8_EVIDENCE=1 cargo test --test infrastructure_fixtures -- --test-threads=1 --nocapture 2>&1 | tee -a target/m8-evidence/fixtures.log
          cargo test --test raw_command_matrix 2>&1 | tee -a target/m8-evidence/fixtures.log
          cargo test --test remaining_ecosystem_e2e 2>&1 | tee -a target/m8-evidence/fixtures.log
          cargo test --test m8_smoke_assertions 2>&1 | tee -a target/m8-evidence/fixtures.log
          cargo test --test reduction 2>&1 | tee -a target/m8-evidence/fixtures.log

      - name: Build production binary
        run: cargo build --release

      - name: Run pinned build, Ruby, Swift, Docker, Podman, and infrastructure smoke tests
        shell: bash
        run: |
          mkdir -p target/m8-evidence
          if sh -x scripts/m8-smoke.sh target/release/ttc target/m8-evidence > target/m8-evidence/smoke.log 2>&1; then
            tail -n 24 target/m8-evidence/smoke-report.txt
          else
            tail -c 12000 target/m8-evidence/smoke.log
            exit 1
          fi

      - name: Verify finalized M8 evidence checksums
        shell: bash
        run: |
          set -euo pipefail
          cd target/m8-evidence
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check --status SHA256SUMS

      - name: Upload passing M8 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m8-remaining-ecosystem-evidence
          path: target/m8-evidence/
          if-no-files-found: error

  m9-distribution:
    name: M9 standalone distribution candidate
    needs: [release-policy, rust, m2-passthrough, m3-streaming, m4-javascript, m5-core-ecosystems, m6-package-monorepo, m7-php-jvm-dotnet, m8-remaining-ecosystems]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust target
        run: rustup toolchain install 1.98.1 --profile minimal --target x86_64-unknown-linux-gnu
      - name: Install pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7
      - name: Build clean locked production target
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu
      - name: Verify installer and standalone behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/m9-candidate/evidence
          ./scripts/test-install.sh 2>&1 | tee target/m9-candidate/evidence/installer.txt
          ./scripts/test-release-artifact.sh 2>&1 | tee target/m9-candidate/evidence/standalone.txt
          python3 scripts/check-spec-coverage.py > target/m9-candidate/evidence/coverage.md
      - name: Collect passing safety, smoke, and reduction reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: m*-evidence
          path: target/m9-candidate/evidence/prerequisites
      - name: Collect passing byte comparison
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: m2-byte-comparison
          path: target/m9-candidate/evidence/prerequisites/m2-byte-comparison
      - name: Package and smoke final assets outside source tree
        shell: bash
        env:
          CHECKOUT_COMMIT: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          install -m 755 target/x86_64-unknown-linux-gnu/release/ttc target/m9-candidate/ttc-x86_64-unknown-linux-gnu
          install -m 755 install.sh target/m9-candidate/install.sh
          TTC_M9_BINARY="$PWD/target/m9-candidate/ttc-x86_64-unknown-linux-gnu" ./scripts/test-release-artifact.sh > target/m9-candidate/evidence/packaged-smoke.txt
          python3 scripts/verify-m9-evidence.py target/m9-candidate/evidence/prerequisites
          printf 'commit=%s\nrun=%s\nversion=' "$CHECKOUT_COMMIT" "$CI_RUN_URL" > target/m9-candidate/evidence/provenance.txt
          python3 scripts/check-release-version.py Cargo.toml >> target/m9-candidate/evidence/provenance.txt
          cd target/m9-candidate
          sha256sum ttc-x86_64-unknown-linux-gnu install.sh > SHA256SUMS
          sha256sum --check --status SHA256SUMS
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS
      - name: Upload verified candidate after all gates pass
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ttc-m9-x86_64-unknown-linux-gnu
          path: target/m9-candidate/
          if-no-files-found: error
