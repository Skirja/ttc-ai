name: TTC CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to rebuild and publish from a clean run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.release_tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}

jobs:
  prepare:
    name: Policy and Linux Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      full_gate: ${{ steps.classify.outputs.full_gate }}
    steps:
      - name: Check out full history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Test CI change policy
        run: python3 scripts/test-ci-change-policy.py

      - name: Select light or full CI gate
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/classify-ci-changes.py

      - name: Test stable release policy
        env:
          IS_RELEASE: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$IS_RELEASE" = true ]; then
            git fetch --no-tags origin master:refs/remotes/origin/master
            git merge-base --is-ancestor HEAD origin/master
          fi
          python3 scripts/test-release-policy.py
          if [ "$IS_RELEASE" = true ]; then
            python3 scripts/check-release-version.py Cargo.toml "$RELEASE_TAG" HEAD origin/master
          else
            python3 scripts/check-release-version.py Cargo.toml
          fi

      - name: Install Rust 1.98.1
        if: steps.classify.outputs.full_gate == 'true'
        run: rustup toolchain install 1.98.1 --profile minimal --target x86_64-unknown-linux-gnu

      - name: Build Linux release binary
        if: steps.classify.outputs.full_gate == 'true'
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Prepare smoke binary and checksum
        if: steps.classify.outputs.full_gate == 'true'
        run: |
          set -euo pipefail
          mkdir -p target/ci-smoke-binary
          install -m 755 target/x86_64-unknown-linux-gnu/release/ttc target/ci-smoke-binary/ttc
          cd target/ci-smoke-binary
          sha256sum ttc > SHA256SUMS
          sha256sum --check --status SHA256SUMS

      - name: Upload smoke binary for this run
        if: steps.classify.outputs.full_gate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary/
          if-no-files-found: error
          retention-days: 1

  rust-safety:
    name: Rust and Execution Safety
    needs: prepare
    if: needs.prepare.outputs.full_gate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false

      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Download smoke binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary

      - name: Verify smoke binary checksum
        run: |
          (cd target/ci-smoke-binary && sha256sum --check --status SHA256SUMS)
          mkdir -p target/release
          install -m 755 target/ci-smoke-binary/ttc target/release/ttc

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install pinned Codex for tests without authentication
        run: ./scripts/m10-install-codex.sh

      - name: Set up pinned Python for Codex runtime fixtures
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Run full Rust suite and capture fixture evidence
        env:
          TTC_M10_TEST_BINARY: ${{ github.workspace }}/target/release/ttc
          TTC_M10_CI_RUNTIME: "1"
        run: |
          set -o pipefail
          mkdir -p target/ci-evidence
          TTC_M8_EVIDENCE=1 cargo test --all-targets --all-features -- --test-threads=1 --nocapture 2>&1 | tee target/ci-evidence/rust-suite.txt

      - name: Verify byte-exact passthrough
        run: sh scripts/m2-evidence.sh target/ci-evidence/passthrough/report.txt

      - name: Verify bounded streaming memory
        run: sh scripts/m3-evidence.sh target/ci-evidence/streaming/report.txt target/release/ttc

      - name: Generate and verify evidence checksums
        run: |
          set -euo pipefail
          cd target/ci-evidence
          find . -type f ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Upload Rust and safety evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-safety-evidence
          path: target/ci-evidence/
          if-no-files-found: error

  javascript-monorepo:
    name: JavaScript and Monorepo
    needs: prepare
    if: needs.prepare.outputs.full_gate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false

      - name: Download smoke binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary

      - name: Verify smoke binary checksum
        run: |
          (cd target/ci-smoke-binary && sha256sum --check --status SHA256SUMS)
          mkdir -p target/release
          install -m 755 target/ci-smoke-binary/ttc target/release/ttc

      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Set up Python 3.14.7
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Set up Go 1.27.1
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.27.1

      - name: Install Rust 1.98.1 for workspace fixtures
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Run JavaScript and monorepo smoke tests
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/m4-smoke.sh target/release/ttc target/ci-evidence/javascript/report.txt
          sh scripts/m6-smoke.sh target/release/ttc target/ci-evidence/monorepo

      - name: Generate and verify evidence checksums
        run: |
          set -euo pipefail
          cd target/ci-evidence
          find . -type f ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Upload JavaScript and monorepo evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javascript-monorepo-evidence
          path: target/ci-evidence/
          if-no-files-found: error

  rust-python-go:
    name: Rust, Python, and Go
    needs: prepare
    if: needs.prepare.outputs.full_gate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false

      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Set up Python 3.14.7
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Set up Go 1.27.1
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.27.1

      - name: Download smoke binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary

      - name: Verify smoke binary checksum
        run: |
          (cd target/ci-smoke-binary && sha256sum --check --status SHA256SUMS)
          mkdir -p target/release
          install -m 755 target/ci-smoke-binary/ttc target/release/ttc

      - name: Install checksum-verified cargo-nextest 0.9.108
        run: |
          set -euo pipefail
          sh scripts/m5-install-nextest.sh "$RUNNER_TEMP/ttc-tools"
          printf 'M5_NEXTEST_BIN=%s/cargo-nextest\n' "$RUNNER_TEMP/ttc-tools" >> "$GITHUB_ENV"

      - name: Run Rust, Python, and Go smoke tests
        run: |
          set -euo pipefail
          mkdir -p target/ci-evidence
          sh scripts/m5-smoke.sh target/release/ttc target/ci-evidence/report.txt

      - name: Generate and verify evidence checksums
        run: |
          set -euo pipefail
          cd target/ci-evidence
          find . -type f ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Upload Rust, Python, and Go evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-python-go-evidence
          path: target/ci-evidence/
          if-no-files-found: error

  php-jvm-dotnet:
    name: PHP, JVM, and .NET
    needs: prepare
    if: needs.prepare.outputs.full_gate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false

      - name: Download smoke binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary

      - name: Verify smoke binary checksum
        run: |
          (cd target/ci-smoke-binary && sha256sum --check --status SHA256SUMS)
          mkdir -p target/release
          install -m 755 target/ci-smoke-binary/ttc target/release/ttc

      - name: Set up PHP 8.4.25 and Composer 2.10.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.4.25
          tools: composer:2.10.3
          extensions: zip
          coverage: none

      - name: Build PHP 8.4.25 from checksum-verified source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libonig-dev libssl-dev libzip-dev zlib1g-dev
          tool_home="$RUNNER_TEMP/m7-tools"
          mkdir -p target/ci-evidence
          if M7_TOOL_HOME="$tool_home" sh scripts/m7-install-php.sh > target/ci-evidence/php-build.log 2>&1; then
            "$tool_home/php-8.4.25/bin/php" --version
          else
            tail -c 12000 target/ci-evidence/php-build.log
            exit 1
          fi
          printf '%s/php-8.4.25/bin\n' "$tool_home" >> "$GITHUB_PATH"

      - name: Set up Java 21.0.12.1
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS

      - name: Set up .NET 10.0.401
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: Install checksum-verified Maven 3.9.16 and Gradle 9.8.0
        shell: bash
        run: |
          export M7_TOOL_HOME="$RUNNER_TEMP/m7-tools"
          . scripts/m7-install-jvm-tools.sh
          printf '%s\n' "$MAVEN_HOME/bin" "$GRADLE_HOME/bin" >> "$GITHUB_PATH"
          printf 'M7_MAVEN_SHA256=%s\n' "$M7_MAVEN_SHA256" >> "$GITHUB_ENV"
          printf 'M7_GRADLE_SHA256=%s\n' "$M7_GRADLE_SHA256" >> "$GITHUB_ENV"

      - name: Run PHP, JVM, and .NET smoke tests
        shell: bash
        run: |
          set -euo pipefail
          if sh scripts/m7-smoke.sh target/release/ttc target/ci-evidence/report.txt > target/ci-evidence/smoke.log 2>&1; then
            tail -n 24 target/ci-evidence/report.txt
          else
            tail -c 12000 target/ci-evidence/smoke.log
            exit 1
          fi

      - name: Generate and verify evidence checksums
        run: |
          set -euo pipefail
          cd target/ci-evidence
          find . -type f ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Upload PHP, JVM, and .NET evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-jvm-dotnet-evidence
          path: target/ci-evidence/
          if-no-files-found: error

  build-infrastructure:
    name: Build, Ruby, Swift, and Infrastructure
    needs: prepare
    if: needs.prepare.outputs.full_gate == 'true'
    runs-on: ubuntu-24.04
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/m8-smoke/ruby/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/target/m8-bundle
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false

      - name: Download smoke binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ttc-linux-smoke-binary
          path: target/ci-smoke-binary

      - name: Verify smoke binary checksum
        run: |
          (cd target/ci-smoke-binary && sha256sum --check --status SHA256SUMS)
          mkdir -p target/release
          install -m 755 target/ci-smoke-binary/ttc target/release/ttc

      - name: Set up Ruby 3.3.8 and Bundler 2.6.9
        uses: ruby/setup-ruby@6797dcbb9a1889fd411d07e8aba7eded53fb8b48 # v1.264.0
        with:
          ruby-version: 3.3.8
          bundler: 2.6.9

      - name: Set up Swift 6.1.2
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: 6.1.2

      - name: Set up isolated Docker Engine 28.1.1
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v28.1.1
          context: ttc-ci-docker
          runtime-basedir: ${{ runner.temp }}/ttc-ci-docker
          set-host: true

      - name: Set up Buildx 0.23.0
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0
        with:
          version: v0.23.0
          driver: docker

      - name: Set up Compose 2.35.1
        uses: docker/setup-compose-action@364cc21a5de5b1ee4a7f5f9d3fa374ce0ccde746 # v1.2.0
        with:
          version: v2.35.1
          cache-binary: false

      - name: Install checksum-verified Make, CMake, Ninja, Terraform, and Helm
        shell: bash
        run: |
          set -euo pipefail
          tool_home="$RUNNER_TEMP/m8-tools"
          mkdir -p "$tool_home"
          M8_TOOL_HOME="$tool_home" sh scripts/m8-install-tools.sh
          printf '%s/bin\n' "$tool_home" >> "$GITHUB_PATH"
          printf '%s/cmake-3.31.6-linux-x86_64/bin\n' "$tool_home" >> "$GITHUB_PATH"

      - name: Install locked Ruby dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Run build, Ruby, Swift, and infrastructure smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ci-evidence
          if sh -x scripts/m8-smoke.sh target/release/ttc target/ci-evidence > target/ci-evidence/smoke.log 2>&1; then
            tail -n 24 target/ci-evidence/smoke-report.txt
          else
            tail -c 12000 target/ci-evidence/smoke.log
            exit 1
          fi

      - name: Generate and verify evidence checksums
        run: |
          set -euo pipefail
          cd target/ci-evidence
          find . -type f ! -name SHA256SUMS ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check --status SHA256SUMS
          find . -type f ! -name EVIDENCE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Upload build, Ruby, Swift, and infrastructure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-ruby-swift-infrastructure-evidence
          path: target/ci-evidence/
          if-no-files-found: error

  linux-artifact:
    name: CI Gate and Linux Artifact
    needs:
      - prepare
      - rust-safety
      - javascript-monorepo
      - rust-python-go
      - php-jvm-dotnet
      - build-infrastructure
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check required job results
        env:
          FULL_GATE: ${{ needs.prepare.outputs.full_gate }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RUST_SAFETY_RESULT: ${{ needs['rust-safety'].result }}
          JAVASCRIPT_MONOREPO_RESULT: ${{ needs['javascript-monorepo'].result }}
          RUST_PYTHON_GO_RESULT: ${{ needs['rust-python-go'].result }}
          PHP_JVM_DOTNET_RESULT: ${{ needs['php-jvm-dotnet'].result }}
          BUILD_INFRASTRUCTURE_RESULT: ${{ needs['build-infrastructure'].result }}
        run: |
          set -euo pipefail
          test "$PREPARE_RESULT" = success
          if [ "$FULL_GATE" = true ]; then
            for result in "$RUST_SAFETY_RESULT" "$JAVASCRIPT_MONOREPO_RESULT" \
              "$RUST_PYTHON_GO_RESULT" "$PHP_JVM_DOTNET_RESULT" "$BUILD_INFRASTRUCTURE_RESULT"; do
              test "$result" = success
            done
          elif [ "$FULL_GATE" = false ]; then
            for result in "$RUST_SAFETY_RESULT" "$JAVASCRIPT_MONOREPO_RESULT" \
              "$RUST_PYTHON_GO_RESULT" "$PHP_JVM_DOTNET_RESULT" "$BUILD_INFRASTRUCTURE_RESULT"; do
              test "$result" = skipped
            done
          else
            printf 'CI gate classification missing or invalid: %s\n' "$FULL_GATE" >&2
            exit 1
          fi

      - name: Check out clean source
        if: needs.prepare.outputs.full_gate == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false

      - name: Install Rust 1.98.1 for Linux target
        if: needs.prepare.outputs.full_gate == 'true'
        run: rustup toolchain install 1.98.1 --profile minimal --target x86_64-unknown-linux-gnu

      - name: Set up Python 3.14.7
        if: needs.prepare.outputs.full_gate == 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.7

      - name: Rebuild candidate binary from clean source
        if: needs.prepare.outputs.full_gate == 'true'
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Verify installer, standalone artifact, and SPEC coverage
        if: needs.prepare.outputs.full_gate == 'true'
        run: |
          set -euo pipefail
          mkdir -p target/ci-candidate/evidence
          ./scripts/test-install.sh 2>&1 | tee target/ci-candidate/evidence/installer.txt
          ./scripts/test-release-artifact.sh 2>&1 | tee target/ci-candidate/evidence/standalone.txt
          python3 scripts/check-spec-coverage.py > target/ci-candidate/evidence/coverage.md

      - name: Download passing test evidence
        if: needs.prepare.outputs.full_gate == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "*-evidence"
          path: target/ci-candidate/evidence/prerequisites

      - name: Verify evidence, provenance, and candidate checksums
        if: needs.prepare.outputs.full_gate == 'true'
        shell: bash
        env:
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          install -m 755 target/x86_64-unknown-linux-gnu/release/ttc target/ci-candidate/ttc-x86_64-unknown-linux-gnu
          install -m 755 install.sh target/ci-candidate/install.sh
          TTC_M9_BINARY="$PWD/target/ci-candidate/ttc-x86_64-unknown-linux-gnu" ./scripts/test-release-artifact.sh > target/ci-candidate/evidence/packaged-smoke.txt
          python3 scripts/verify-m9-evidence.py target/ci-candidate/evidence/prerequisites
          CHECKOUT_COMMIT="$(git rev-parse HEAD)"
          printf 'commit=%s\nrun=%s\nversion=' "$CHECKOUT_COMMIT" "$CI_RUN_URL" > target/ci-candidate/evidence/provenance.txt
          python3 scripts/check-release-version.py Cargo.toml >> target/ci-candidate/evidence/provenance.txt
          cd target/ci-candidate
          sha256sum ttc-x86_64-unknown-linux-gnu install.sh > SHA256SUMS
          sha256sum --check --status SHA256SUMS
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-SHA256SUMS
          sha256sum --check --status EVIDENCE-SHA256SUMS

      - name: Upload Linux candidate after all gates pass
        if: needs.prepare.outputs.full_gate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ttc-linux-gnu-candidate
          path: target/ci-candidate/
          if-no-files-found: error

      - name: Record light documentation gate
        if: needs.prepare.outputs.full_gate == 'false'
        run: echo "Light documentation checks passed for this commit."

  publish-stable-release:
    name: Publish Stable Release
    needs: linux-artifact
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out tagged source and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download fully verified Linux candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ttc-linux-gnu-candidate
          path: target/release-candidate

      - name: Verify tag, source containment, manual evidence, and checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/master
          python3 scripts/check-release-version.py Cargo.toml "$RELEASE_TAG" "$RELEASE_COMMIT" origin/master
          python3 scripts/check-codex-release-gate.py ai_docs/M10_CODEX_EVIDENCE.json
          cd target/release-candidate
          sha256sum --check --status SHA256SUMS
          chmod 755 ./ttc-x86_64-unknown-linux-gnu
          test "$(./ttc-x86_64-unknown-linux-gnu --version)" = "ttc ${RELEASE_TAG#v}"
          test -x ./ttc-x86_64-unknown-linux-gnu
          test -f ./install.sh

      - name: Refuse to overwrite an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Publish verified binary, checksums, and installer
        working-directory: target/release-candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            ttc-x86_64-unknown-linux-gnu SHA256SUMS install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TTC ${RELEASE_TAG#v}" \
            --notes "Stable TTC ${RELEASE_TAG#v}. Assets were built and verified by this workflow run."
